---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: metrics
  labels:
    app: victoria-metrics
  namespace: metrics
spec:
  rules:
    - host: metrics.jrzylab.xyz
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: vmsingle-datastore
                port:
                  number: 8428
          - pathType: Prefix
            path: /metrics
            backend:
              service:
                name: vm-operator-metrics-service
                port:
                  number: 8080
          